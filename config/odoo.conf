[options]
# Database
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_maxconn = 64

# Addons
addons_path = /mnt/extra-addons

# Admin
admin_passwd = admin123
list_db = True

# Logging
log_level = info
log_handler = :INFO

# Workers (0 for development)
workers = 0

# Performance
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

# Development
dev_mode = reload
